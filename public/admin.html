<!doctype html>
<html lang="sw">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f73"><title>Mickey Water | Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{--ink:#17221f;--muted:#687873;--paper:#f5f4ee;--white:#fff;--line:#dfe4dc;--teal:#087f73;--orange:#a34c17}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:30px}.brand{font-weight:bold;font-size:1.2rem}.actions{display:flex;gap:8px}.button{border:1px solid var(--line);background:var(--white);padding:9px 13px;border-radius:4px;color:var(--ink);font:700 .78rem Arial,sans-serif;cursor:pointer}.button.primary{background:var(--teal);border-color:var(--teal);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}.stat,.panel{background:var(--white);border:1px solid var(--line);padding:20px;box-shadow:0 14px 35px rgba(23,34,31,.07)}.stat small{display:block;color:var(--muted);font:700 .68rem Arial,sans-serif;text-transform:uppercase;margin-bottom:9px}.stat strong{font-size:1.65rem;font-weight:normal}.panel h2{font-size:1.35rem;font-weight:normal;margin:0 0 5px}.panel p{color:var(--muted);font: .82rem Arial,sans-serif}.payment{display:grid;grid-template-columns:1fr auto;gap:14px;border-top:1px solid var(--line);padding:17px 0}.payment:first-child{border-top:0}.payment strong{font-size:1.05rem}.details{color:var(--muted);font: .78rem/1.7 Arial,sans-serif}.payment-actions{display:flex;gap:7px;align-items:center}.reject{color:var(--orange);border-color:#efc8b7}.empty{color:var(--muted);font: .85rem Arial,sans-serif;padding:14px 0}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.payment{grid-template-columns:1fr}.payment-actions{align-items:stretch}.payment-actions .button{flex:1}}@media(max-width:420px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:14px;flex-direction:column}}
    :root{--ink:#102a2b;--muted:#627772;--paper:#edf4ef;--white:#fffdf8;--line:#c8d9d0;--teal:#087f73;--orange:#c96832}
    body{background:radial-gradient(circle at 90% 0%,rgba(212,237,117,.42),transparent 24%),linear-gradient(135deg,#edf4ef,#e3eee8 58%,#d9e9e1);font-family:Georgia,'Times New Roman',serif}.shell{max-width:1240px;padding:30px 34px 70px}.top{margin-bottom:38px}.brand{font-size:1.3rem}.button{border-radius:7px}.button.primary{background:var(--teal)}.stats{gap:14px}.stat,.panel{border-radius:12px;background:rgba(255,253,248,.9);border-color:rgba(200,217,208,.95);box-shadow:0 18px 50px rgba(16,42,43,.11);backdrop-filter:blur(8px)}.stat{padding:23px}.stat strong{font-size:2rem}.stat small{letter-spacing:.08em}.panel{padding:28px}.panel h2{font-size:1.55rem}.payment{padding:20px 0}.payment-actions .button{padding:11px 14px}@media(max-width:720px){.shell{padding:20px 16px 44px}.panel{padding:21px}}
  </style>
</head>
<body><main class="shell"><header class="top"><div class="brand">Mickey Water / Admin</div><div class="actions"><a class="button" href="dashboard.html">Dashboard</a><button class="button" id="logout">Toka</button></div></header><section class="stats"><div class="stat"><small>Watumiaji</small><strong id="users">0</strong></div><div class="stat"><small>Bills</small><strong id="bills">0</strong></div><div class="stat"><small>Jumla billed</small><strong id="billed">TZS 0</strong></div><div class="stat"><small>Imekusanywa</small><strong id="collected">TZS 0</strong></div></section><section class="panel"><h2>Idhini za malipo</h2><p>Thibitisha malipo kabla ya risiti kutumwa.</p><div id="payments"><div class="empty">Inapakia...</div></div></section></main><script>
const token=localStorage.getItem('mickey_token');const user=JSON.parse(localStorage.getItem('mickey_user')||'{}');if(!token||user.role!=='admin')location.href='index.html';const $=id=>document.getElementById(id);const money=value=>'TZS '+Number(value||0).toLocaleString('sw-TZ');
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.message||'Request imeshindikana');return data}
async function load(){try{const summary=await api('/api/admin/summary');$('users').textContent=summary.users;$('bills').textContent=summary.bills;$('billed').textContent=money(summary.totalBilled);$('collected').textContent=money(summary.totalCollected);const payments=await api('/api/admin/payments/pending');$('payments').innerHTML=payments.length?payments.map(item=>`<article class="payment"><div><strong>${escapeHtml(item.record.customerName)}</strong><div class="details">${escapeHtml(item.record.phone)} | ${money(item.payment.amount)} | Rejea: ${escapeHtml(item.payment.reference||'Haijawekwa')}<br>Mtumiaji: ${escapeHtml(item.record.createdBy?.name||'')}</div></div><div class="payment-actions"><button class="button primary" onclick="approve('${item.record._id}','${item.payment._id}')">Idhinisha</button><button class="button reject" onclick="rejectPayment('${item.record._id}','${item.payment._id}')">Kataa</button></div></article>`).join(''):'<div class="empty">Hakuna malipo yanayosubiri.</div>'}catch(error){$('payments').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function approve(recordId,paymentId){try{await api(`/api/admin/payments/${recordId}/${paymentId}/approve`,{method:'PATCH'});await load()}catch(error){alert(error.message)}}async function rejectPayment(recordId,paymentId){const reason=prompt('Sababu ya kukataa:');if(!reason)return;try{await api(`/api/admin/payments/${recordId}/${paymentId}/reject`,{method:'PATCH',body:JSON.stringify({reason})});await load()}catch(error){alert(error.message)}}$('logout').onclick=()=>{localStorage.clear();location.href='index.html'};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
