<!doctype html>
<html lang="sw">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mickey Water | Badilisha nywila</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4ee;color:#17221f;font-family:Arial,sans-serif}.box{background:#fff;padding:28px;width:min(92%,380px);border:1px solid #dfe4dc;box-shadow:0 18px 45px #17221f18}.field{margin:14px 0}.field label{display:block;font-size:.75rem;color:#6b7975;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe4dc}.submit{width:100%;padding:13px;background:#087f73;color:#fff;border:0;cursor:pointer}.msg{margin:12px 0;font-size:.85rem}</style></head>
<body><main class="box"><h1>Badilisha nywila</h1><p>Weka nywila mpya ya akaunti yako.</p><div class="msg" id="message"></div><form id="form"><div class="field"><label>NYWILA MPYA</label><input id="password" type="password" minlength="8" required></div><button class="submit">Hifadhi nywila</button></form></main><script>const token=new URLSearchParams(location.search).get('token');const message=document.getElementById('message');document.getElementById('form').onsubmit=async event=>{event.preventDefault();const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('password').value})});const data=await res.json();message.textContent=data.message;if(res.ok)setTimeout(()=>location.href='index.html',1500)}</script></body></html>
