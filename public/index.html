<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mickey Water - Ingia / Jisajili</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;font-family:'Segoe UI',sans-serif;background:#eef2ff;display:grid;place-items:center;padding:24px}
    .card{width:100%;max-width:420px;background:#fff;padding:28px;border-radius:20px;box-shadow:0 20px 40px rgba(15,23,42,.08)}
    h1{margin-bottom:12px;font-size:1.65rem;color:#1e293b}
    p{color:#475569;margin-bottom:22px;font-size:0.95rem}
    .field{display:grid;gap:8px;margin-bottom:16px}
    label{font-size:0.92rem;color:#334155;font-weight:600}
    input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:12px;font-size:0.95rem}
    input:focus{outline:none;border-color:#3730a3;box-shadow:0 0 0 3px rgba(55,48,163,.1)}
    button{width:100%;padding:12px 14px;border:none;border-radius:12px;background:#3730a3;color:#fff;font-weight:700;cursor:pointer;transition:background 0.2s}
    button:hover{background:#2e26a0}
    .footer{margin-top:20px;text-align:center;color:#64748b;font-size:0.92rem}
    .link{color:#3730a3;text-decoration:none;font-weight:700;cursor:pointer}
    .link:hover{text-decoration:underline}
    .error{color:#b91c1c;margin-bottom:16px;padding:10px;background:#fee2e2;border-radius:8px;font-size:0.92rem}
    .success{color:#15803d;margin-bottom:16px;padding:10px;background:#dcfce7;border-radius:8px;font-size:0.92rem}
    
    .tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid #e2e8f0}
    .tab-btn{flex:1;padding:12px;border:none;background:transparent;color:#64748b;cursor:pointer;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s}
    .tab-btn.active{color:#3730a3;border-bottom-color:#3730a3}
    
    .form-section{display:none}
    .form-section.active{display:block}
  </style>
</head>
<body>
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Ingia</button>
      <button class="tab-btn" onclick="switchTab('register')">Jisajili</button>
      <button class="tab-btn" onclick="switchTab('forgot')">Sahau Nywila</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login" class="form-section active">
      <h1>Ingia</h1>
      <p>Ingiza email na nywila yako kwa dashboard ya Mickey Water.</p>
      <div id="loginError" class="error" style="display:none"></div>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" required autocomplete="username">
        </div>
        <div class="field">
          <label>Nywila</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit">Ingia</button>
      </form>
    </div>

    <!-- REGISTER FORM -->
    <div id="register" class="form-section">
      <h1>Jisajili</h1>
      <p>Unda akaunti ya mtumiaji ili kuhifadhi ankara zako.</p>
      <div id="registerError" class="error" style="display:none"></div>
      <div id="registerSuccess" class="success" style="display:none"></div>
      <form id="registerForm">
        <div class="field">
          <label>Jina kamili</label>
          <input type="text" id="registerName" required autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="registerEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label>Nywila</label>
          <input type="password" id="registerPassword" required autocomplete="new-password">
        </div>
        <button type="submit">Jisajili</button>
      </form>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div id="forgot" class="form-section">
      <h1>Sahau Nywila</h1>
      <p>Ingiza email yako ili kupokea ujumbe wa kubadilisha nywila.</p>
      <div id="forgotError" class="error" style="display:none"></div>
      <div id="forgotSuccess" class="success" style="display:none"></div>
      <form id="forgotForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="forgotEmail" required autocomplete="email">
        </div>
        <button type="submit">Tuma Ujumbe wa Kubadilisha</button>
      </form>
    </div>

    <div class="footer" id="footerText">
      <p>Mtumiaji mpya? <a class="link" onclick="switchTab('register')">Jisajili hapa</a></p>
    </div>
  </div>

  <script>
    function switchTab(tab, clickedButton) {
      // Hide all sections
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      // Show selected section
      document.getElementById(tab).classList.add('active');
      const button = clickedButton || document.querySelector(`.tab-btn[onclick*="'${tab}'"]`);
      if (button) button.classList.add('active');
      
      // Update footer text
      const footerText = document.getElementById('footerText');
      if(tab === 'login') {
        footerText.innerHTML = '<p>Mtumiaji mpya? <a class="link" onclick="switchTab(\'register\')">Jisajili hapa</a></p>';
      } else if(tab === 'register') {
        footerText.innerHTML = '<p>Umekwisha kuwa na akaunti? <a class="link" onclick="switchTab(\'login\')">Ingia hapa</a></p>';
      } else {
        footerText.innerHTML = '<p><a class="link" onclick="switchTab(\'login\')">Rudi kwenye login</a></p>';
      }
    }

    // LOGIN FORM
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('loginError');
      errorBox.style.display = 'none';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Hitilafu ya kuingia');

        localStorage.setItem('mickey_token', data.token);
        localStorage.setItem('mickey_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    // REGISTER FORM
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('registerError');
      const successBox = document.getElementById('registerSuccess');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value.trim();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Hitilafu ya kusajili');

        successBox.textContent = 'Umefanikiwa kusajili. Tafadhali ingia.';
        successBox.style.display = 'block';
        document.getElementById('registerForm').reset();
        setTimeout(() => switchTab('login'), 2000);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    // FORGOT PASSWORD FORM
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('forgotError');
      const successBox = document.getElementById('forgotSuccess');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const email = document.getElementById('forgotEmail').value.trim();

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Hitilafu ya kusambaza ujumbe');

        successBox.textContent = 'Ujumbe wa kubadilisha nywila umesambazwa kwenye email yako.';
        successBox.style.display = 'block';
        document.getElementById('forgotForm').reset();
        setTimeout(() => switchTab('login'), 3000);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
