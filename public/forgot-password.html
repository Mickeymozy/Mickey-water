<!doctype html>
<html lang="sw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="theme-color" content="#197b78">
	<link rel="manifest" href="manifest.json">
	<title>Mickey Water | Sahau nywila</title>
	<style>
		:root{--ink:#17221f;--muted:#687873;--line:#d5e0d9;--teal:#087f73;--orange:#c96832;--paper:#edf4ef;--white:#fffdf8}
		*{box-sizing:border-box}
		body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(16,42,43,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,42,43,.035) 1px,transparent 1px),linear-gradient(135deg,#edf4ef,#d9e9e1);background-size:34px 34px,34px 34px,auto;color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif}
		.auth-page{width:min(100%,440px)}
		.brand{display:flex;align-items:center;gap:12px;margin:0 0 22px;color:var(--ink);font-weight:700;text-decoration:none}
		.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--teal);color:#d4ed75;font:700 .78rem Arial,sans-serif;box-shadow:4px 4px 0 #d4ed75}
		.brand small{display:block;margin-top:3px;color:var(--muted);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
		.auth-panel{padding:clamp(24px,6vw,36px);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:10px;background:var(--white);box-shadow:0 24px 60px rgba(16,42,43,.12)}
		.kicker{margin:0 0 9px;color:var(--orange);font:700 .66rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
		h1{margin:0;font:normal 2rem Georgia,"Times New Roman",serif}
		.intro{margin:10px 0 22px;color:var(--muted);font-size:.88rem;line-height:1.6}
		.message{min-height:20px;margin:0 0 10px;color:var(--teal);font-size:.82rem;line-height:1.5}
		.field{margin:0 0 18px}
		label{display:block;margin-bottom:7px;color:var(--muted);font-size:.67rem;font-weight:700;letter-spacing:.08em}
		input{width:100%;min-height:46px;padding:12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font: .9rem "Trebuchet MS",Verdana,sans-serif}
		input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(8,127,115,.14)}
		button{width:100%;min-height:46px;border:0;border-radius:7px;background:var(--teal);color:#fff;font:700 .84rem "Trebuchet MS",Verdana,sans-serif;cursor:pointer;transition:background .2s,transform .2s}
		button:hover{background:#075b54;transform:translateY(-1px)}
		button:disabled{opacity:.6;cursor:wait;transform:none}
		button:focus-visible,a:focus-visible{outline:3px solid rgba(201,104,50,.35);outline-offset:3px}
		.back-link{display:inline-block;margin-top:19px;color:var(--teal);font-size:.8rem;font-weight:700;text-decoration:none}
		.back-link:hover{text-decoration:underline}
		@media(prefers-reduced-motion:reduce){button{transition:none}}
	</style>
	<link rel="stylesheet" href="portal-refresh.css">
</head>
<body>
	<main class="auth-page">
		<a class="brand" href="index.html"><span class="mark">MW</span><span>Mickey Water<small>Water Billing System</small></span></a>
		<section class="auth-panel" aria-labelledby="pageTitle">
			<p class="kicker">Urejeshaji wa akaunti</p>
			<h1 id="pageTitle">Sahau nywila?</h1>
			<p class="intro">Weka email yako. Kama akaunti ipo, utapokea link ya kubadilisha nywila.</p>
			<p class="message" id="message" role="status" aria-live="polite"></p>
			<form id="form">
				<div class="field"><label for="email">EMAIL</label><input id="email" type="email" required autocomplete="email"></div>
				<button type="submit">Tuma link</button>
			</form>
			<a class="back-link" href="index.html">Rudi kuingia</a>
		</section>
	</main>
	<script>
		const form=document.getElementById('form');
		const message=document.getElementById('message');
		form.onsubmit=async event=>{
			event.preventDefault();
			const button=form.querySelector('button');
			button.disabled=true;
			message.textContent='Inatuma ombi...';
			try{
				const response=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});
				const data=await response.json().catch(()=>({}));
				message.textContent=data.message||'Ombi halijakamilika. Jaribu tena.';
			}catch(error){message.textContent='Muunganisho haupatikani. Jaribu tena.'}
			finally{button.disabled=false}
		};
	</script>
</body>
</html>
