<!doctype html>
<html lang="sw">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f73"><link rel="manifest" href="manifest.json"><title>Mickey Water | Sahau nywila</title><style>:root{--ink:#102a2b;--muted:#627772;--paper:#edf4ef;--white:#fffdf8;--line:#c8d9d0;--teal:#087f73;--orange:#c96832}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 90% 0%,#d4ed7566,transparent 25%),linear-gradient(135deg,#edf4ef,#d9e9e1);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.box{background:#fffdf8e8;padding:34px;width:min(92%,420px);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px #102a2b24}.box h1{font-size:2rem;font-weight:normal}.box p{color:var(--muted);font: .9rem/1.6 Arial,sans-serif}.field{margin:18px 0}.field label{display:block;font-size:.7rem;font-weight:bold;color:var(--muted);margin-bottom:7px;letter-spacing:.08em}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:7px;background:#f7fbf8}.submit{width:100%;padding:14px;background:var(--teal);color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:bold}.msg{margin:12px 0;font: .85rem Arial,sans-serif}a{color:var(--teal)}</style></head>
<body><main class="box"><h1>Sahau nywila?</h1><p>Weka email yako. Kama akaunti ipo, utapokea link ya kubadilisha nywila.</p><div class="msg" id="message"></div><form id="form"><div class="field"><label>EMAIL</label><input id="email" type="email" required autocomplete="email"></div><button class="submit">Tuma link</button></form><p><a href="index.html">Rudi kuingia</a></p></main><script>document.getElementById('form').onsubmit=async event=>{event.preventDefault();const res=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const data=await res.json();document.getElementById('message').textContent=data.message}</script></body></html>
